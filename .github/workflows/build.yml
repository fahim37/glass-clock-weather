name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk glass-clock-weather.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glass-clock-weather-apk
          path: glass-clock-weather.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest glass-clock-weather.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "Built from ${GITHUB_SHA}. Download glass-clock-weather.apk below and open it on the phone to install or update."
